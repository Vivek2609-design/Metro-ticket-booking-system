<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Booking</title>
    <style>
         body{
            background-image: url("nice.png");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: 100% 100%;
        }
    </style>
</head>
<body>

   <div align="middle">
       <form action="bookingaction.jsp" method="post">
       <h1 style="color: rgb(231, 243, 13);font-size: 45px;">Book Your Tickets Online Here</h1><br>
       <h3 style="font-size: 35px;color: rgb(249, 11, 11);"><marquee>Welcome To Metro Railways</marquee></h3>
    <h3 style="color: rgb(8, 235, 171);">From <input type="text" name="from" ><br><br>
    To <input type="text" name="to"><br><br>
    Date : <input type="date" name="date"><br><br>
    Time : <input type="time" name="time"><br><br>
    Number Of Tickets <input type="tickets" name="tickets"><br><br>
</h3>
    <input type="submit" style="color: black;background-color: azure;">
</form>
</div>
</body>
</html>
